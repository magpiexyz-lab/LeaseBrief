# EVENTS.yaml — Analytics Event Dictionary for LeaseBrief
#
# Generated by /spec from experiment.yaml golden_path, behaviors, and hypothesis formulas.
# Folded in stack-emitted events from .claude/stacks/{framework/nextjs.md,auth/supabase.md}.
#
# Rules:
#   1. Every event MUST have a funnel_stage: reach|demand|activate|monetize|retain
#   2. Naming: <object>_<action> in snake_case
#   3. Multiple events MAY share the same funnel_stage
#   4. Cross-MVP comparison aggregates by funnel_stage with distinct_id dedup
#   5. /change and /distribute can add events incrementally after bootstrap

global_properties:
  project_name:
    description: From experiment.yaml `name` field. Identifies which experiment this data belongs to.
    type: string
    required: true
  project_owner:
    description: From experiment.yaml `owner` field. Identifies who owns this experiment.
    type: string
    required: true

events:
  # ─── REACH ─────────────────────────────────────────────────────────────────
  landing_view:
    funnel_stage: reach
    trigger: User loads the LeaseBrief landing page (any variant URL /v/<slug> or root)
    properties:
      variant:
        type: string
        required: false
        description: Variant slug (speed | cost | confidential) — present when landing was served from /v/<slug>
      utm_source:
        type: string
        required: false
        description: UTM source captured from query string (linkedin | reddit | ccim | direct | ...)
      utm_medium:
        type: string
        required: false
        description: UTM medium (cpc | post | newsletter | ...)
      utm_campaign:
        type: string
        required: false
        description: UTM campaign identifier
      utm_content:
        type: string
        required: false
        description: UTM content — typically the variant slug or sitelink id for per-creative attribution
      gclid:
        type: string
        required: false
        description: Google Click Identifier (for Google Ads conversion attribution)
      click_id:
        type: string
        required: false
        description: Generic click ID from the originating ad platform (mirrors gclid for google-ads)
      referrer:
        type: string
        required: false
        description: document.referrer at page load

  qualified_paid_visit:
    funnel_stage: reach
    trigger: A landing_view whose UTM/referrer matches the qualified CRE channel allowlist (LinkedIn job-title campaigns, r/CommercialRealEstate, biggerpockets.com, ccim.com)
    properties:
      source_channel:
        type: string
        required: true
        description: Classified channel (linkedin_cre | reddit_cre | biggerpockets | ccim | other_paid)
      variant:
        type: string
        required: false
        description: Variant slug that received the qualified visit

  # ─── DEMAND ────────────────────────────────────────────────────────────────
  cta_click:
    funnel_stage: demand
    trigger: User clicks the primary CTA on the landing page ("Abstract a Lease Free" / "Start Your $399 Trial" / "Abstract Your Lease Privately")
    properties:
      variant:
        type: string
        required: false
        description: Variant slug whose CTA was clicked
      cta_position:
        type: string
        required: false
        description: Position of the clicked CTA (hero | feature_section | footer)

  # ─── ACTIVATE ──────────────────────────────────────────────────────────────
  signup_start:
    funnel_stage: activate
    trigger: Signup page mounts (stack-emitted by auth/supabase.md template from src/app/signup/page.tsx)
    properties:
      auth_method:
        type: string
        required: false
        description: Method shown to the user (email | google | both)

  signup_complete:
    funnel_stage: activate
    trigger: Supabase auth successfully creates a user; redirect to /dashboard initiated (stack-emitted by auth/supabase.md)
    properties:
      auth_method:
        type: string
        required: true
        description: Method used (email | google)

  abstract_started:
    funnel_stage: activate
    trigger: User uploads a PDF (drag-drop or file-picker) on /dashboard or /abstract-new; abstracts row is created with status='processing'
    properties:
      abstract_id:
        type: string
        required: true
        description: UUID of the new abstract row
      file_size_kb:
        type: number
        required: true
        description: Uploaded PDF file size in kilobytes
      file_pages:
        type: number
        required: false
        description: PDF page count (parsed during upload)

  field_extracted:
    funnel_stage: activate
    trigger: Server-side — one event per field the AI extraction job persists to abstract_fields (fires 30x per abstract)
    properties:
      abstract_id:
        type: string
        required: true
        description: Parent abstract UUID
      field_name:
        type: string
        required: true
        description: Field identifier (e.g., base_rent, escalation_type, nnn_pass_through, option_to_extend)
      confidence:
        type: number
        required: true
        description: Per-field confidence score in [0, 1]

  field_high_confidence:
    funnel_stage: activate
    trigger: Server-side — fires for each extracted field where confidence >= 0.85 (no review required); h-02 numerator
    properties:
      abstract_id:
        type: string
        required: true
        description: Parent abstract UUID
      field_name:
        type: string
        required: true
        description: Field identifier
      confidence:
        type: number
        required: true
        description: Per-field confidence score (always >= 0.85 here)

  abstract_view:
    funnel_stage: activate
    trigger: User opens /abstract/<id> after extraction has completed
    properties:
      abstract_id:
        type: string
        required: true
        description: Abstract being viewed
      extraction_duration_ms:
        type: number
        required: false
        description: Time from upload to ready status

  review_field_edited:
    funnel_stage: activate
    trigger: User edits a low-confidence field in the review queue and saves
    properties:
      abstract_id:
        type: string
        required: true
        description: Parent abstract UUID
      field_name:
        type: string
        required: true
        description: Field that was edited
      original_confidence:
        type: number
        required: true
        description: Confidence score before the manual edit

  abstract_completed:
    funnel_stage: activate
    trigger: User clicks "Approve Abstract" on /abstract/<id>; abstract status updates to 'approved'
    properties:
      abstract_id:
        type: string
        required: true
        description: Approved abstract UUID
      review_fields_edited:
        type: number
        required: true
        description: Count of fields the reviewer edited before approval
      extraction_duration_ms:
        type: number
        required: false
        description: End-to-end time from upload to approval

  feedback_submitted:
    funnel_stage: activate
    trigger: User submits the post-activation feedback widget
    properties:
      source:
        type: string
        required: false
        description: "How the user found LeaseBrief (google | social | friend | other)"
      feedback:
        type: string
        required: false
        description: Free-text feedback from the user
      activation_action:
        type: string
        required: true
        description: Activation step that preceded this submission (abstract_completed)

  # ─── MONETIZE ──────────────────────────────────────────────────────────────
  checkout_started:
    funnel_stage: monetize
    requires: [payment]
    trigger: User clicks "Upgrade to Pro" on /pricing or /dashboard; Stripe Checkout session is created and the user is redirected
    properties:
      variant:
        type: string
        required: false
        description: Variant slug the user arrived from
      abstract_count_at_upgrade:
        type: number
        required: true
        description: Number of completed abstracts at the moment of upgrade click

  checkout_completed:
    funnel_stage: monetize
    requires: [payment]
    trigger: Server-side — Stripe checkout.session.completed webhook successfully processed; user.plan set to 'pro'
    properties:
      plan:
        type: string
        required: true
        description: Plan activated (always 'pro' in MVP)
      amount_usd:
        type: number
        required: true
        description: Amount charged in USD (399 baseline)

  abstract_exported:
    funnel_stage: monetize
    trigger: User downloads an export CSV for an approved abstract (Yardi, MRI, or AppFolio Commercial format)
    properties:
      abstract_id:
        type: string
        required: true
        description: Abstract that was exported
      format:
        type: string
        required: true
        description: Target format (yardi | mri | appfolio)
      plan_at_export:
        type: string
        required: true
        description: User plan when export occurred (free | pro)

  # ─── RETAIN ────────────────────────────────────────────────────────────────
  retain_return:
    funnel_stage: retain
    trigger: User returns to the app >= 24h after their first visit (stack-emitted by framework/nextjs.md from src/components/RetainTracker.tsx)
    properties:
      days_since_first:
        type: number
        required: true
        description: Whole days elapsed since the user's first session
      has_completed_abstract:
        type: boolean
        required: false
        description: Whether the user had any abstract_completed event before this return
