# ads.yaml — Google Ads campaign config for LeaseBrief
# Generated by /distribute (Phase 1 Playbook, manual CPC, phrase match,
# Search-only, 5-day duration, single STAG ad group).
#
# Review every field, then approve to launch. Campaign starts PAUSED;
# you must unpause it from the Google Ads UI after the pre-flight
# checklist passes.

# --- Channel ---
channel: google-ads

# --- Campaign Identity ---
campaign_name: leasebrief-search-v1
project_name: leasebrief
landing_url: https://leasebrief.draftlabs.org

# --- Phase ---
# Phase 1: Standardized Playbook (manual CPC, phrase match, Search only,
# 1 STAG, 2 RSAs, 50 universal negatives). After 5-7 days of data, run
# /distribute --phase 2 to enable automated bidding and broader matching.
phase: 1

# --- Keywords ---
# Phase 1 = phrase match for all keywords. If any keyword gets zero
# impressions after 48 hours, switch that keyword to broad match.
# Target audience: mid-market CRE brokers actively searching for a way
# to stop paying outsourcers (Datapoint, Lease Probe) per-lease fees.
keywords:
  phrase:
    - "\"lease abstraction software\""
    - "\"commercial lease abstraction\""
    - "\"lease abstract tool\""
    - "\"lease abstract service\""
    - "\"abstract a commercial lease\""
    - "\"cre lease abstract\""
    - "\"lease summary tool\""
    - "\"lease data extraction\""
  exact: []
  broad: []
  negative:
    # --- Universal negatives (50 — Phase 1 Playbook) ---
    - "free"
    - "how to"
    - "what is"
    - "tutorial"
    - "guide"
    - "example"
    - "definition"
    - "meaning"
    - "template"
    - "sample"
    - "course"
    - "training"
    - "jobs"
    - "salary"
    - "hiring"
    - "career"
    - "careers"
    - "internship"
    - "resume"
    - "job"
    - "login"
    - "sign in"
    - "customer service"
    - "support"
    - "complaint"
    - "refund"
    - "lawsuit"
    - "scam"
    - "vs"
    - "versus"
    - "comparison"
    - "alternative"
    - "compare"
    - "download"
    - "crack"
    - "pirate"
    - "torrent"
    - "github"
    - "open source"
    - "wiki"
    - "wikipedia"
    - "history"
    - "explained"
    - "beginner"
    - "learn"
    - "dummies"
    - "ebook"
    - "pdf"
    - "definition of"
    - "youtube"
    # --- LeaseBrief-specific negatives ---
    - "residential lease"
    - "apartment lease"
    - "rental agreement"
    - "lease agreement template"
    - "tenant rights"
    - "landlord forms"
    - "free lease template"
    - "lease calculator"

# --- Responsive Search Ads (2 RSAs per Phase 1 Playbook) ---
# H1 + H2 are pinned to lock the MVP name and primary value prop.
# H3-H8 rotate; Google picks the best combos. Descriptions are unpinned.
ads:
  - name: "rsa-1-outsource-cost"
    pinned_headlines:
      H1: "LeaseBrief"                          # 10 chars
      H2: "Lease Abstracts in 90s"              # 22 chars
    unpinned_headlines:
      - "Stop the Outsource Bill"               # 23 chars
      - "30 Fields, AI Extracted"               # 23 chars
      - "Yardi MRI AppFolio Export"             # 24 chars
      - "Built for CRE Brokers"                 # 20 chars
      - "Per-Field Confidence"                  # 20 chars
      - "First Abstract Free"                   # 19 chars
    descriptions:
      - "Drop a commercial lease PDF. Get 30 structured fields in 90 seconds. For CRE brokers."   # 85
      - "Confidence scoring routes uncertain fields to your review queue. Stay in control."        # 82
      - "Outsourced abstracts run $200-500 each. LeaseBrief Pro is $19/mo, 50 abstracts incl."     # 87
      - "First abstract is free, no credit card required. Start in 90 seconds."                    # 71

  - name: "rsa-2-speed"
    pinned_headlines:
      H1: "LeaseBrief"                          # 10 chars
      H2: "90-Second Lease Abstracts"           # 25 chars
    unpinned_headlines:
      - "From 4 Hours to 90 Seconds"            # 26 chars
      - "Skip the Outsource Wait"               # 23 chars
      - "Yardi MRI AppFolio Ready"              # 24 chars
      - "Mid-Market CRE Tool"                   # 19 chars
      - "Review Queue Built In"                 # 21 chars
      - "Try One Lease Free"                    # 18 chars
    descriptions:
      - "Replace 4-8 hours of in-house abstraction with an AI tool that runs in 90 seconds."       # 84
      - "30 structured fields per lease. Per-field confidence. Review queue for the rest."         # 81
      - "Built for mid-market CRE brokers running 10-30 lease abstracts a month."                   # 73
      - "First abstract is free — no card on file. See it for yourself."                            # 62

# --- Sitelink Extensions (auto-generated from golden_path) ---
# 3 sitelinks for Phase 1 — gives Google enough room without bloat.
sitelinks:
  - link_text: "Try it free"
    description_1: "First lease abstract is free"
    description_2: "No credit card required"
    final_url: "https://leasebrief.draftlabs.org/signup?utm_source=google&utm_medium=cpc&utm_campaign=leasebrief-search-v1&utm_content=sitelink_signup"
  - link_text: "See pricing"
    description_1: "$19/mo · 50 abstracts incl."
    description_2: "Cancel any month"
    final_url: "https://leasebrief.draftlabs.org/pricing?utm_source=google&utm_medium=cpc&utm_campaign=leasebrief-search-v1&utm_content=sitelink_pricing"
  - link_text: "Cost angle"
    description_1: "Stop paying $300/lease"
    description_2: "Built for CRE brokers"
    final_url: "https://leasebrief.draftlabs.org/v/cost?utm_source=google&utm_medium=cpc&utm_campaign=leasebrief-search-v1&utm_content=sitelink_variant_cost"

# --- Budget & Bidding ---
budget:
  daily_budget_cents: 2000        # $20/day
  total_budget_cents: 10000       # $100 total cap
  duration_days: 5
  bidding_strategy: manual_cpc    # Phase 1 — switch to maximize_conversions in Phase 2

# --- Targeting ---
targeting:
  locations:
    - US
    - CA
  languages:
    - en
  # No demographic or audience targeting initially. Let Google's search
  # intent signal (the keywords) do the qualification.

# --- Conversion Tracking ---
# PostHog fires events client-side. Google Ads imports them as Offline
# Conversions via the PostHog → Google Ads connector (one-time setup in
# Google Ads → Conversions → Import). gclid is captured on landing_view
# and persisted to sessionStorage by src/app/layout.tsx.
conversions:
  primary_action: signup_complete
  secondary_actions:
    - abstract_completed
    - feedback_submitted
  import_method: posthog_webhook

# --- Guardrails ---
guardrails:
  max_cpc_cents: 500              # never bid more than $5/click
  min_daily_clicks: 2             # alert if fewer than 2 clicks/day after day 2
  auto_pause_rules:
    - condition: total_spend >= total_budget_cents
      action: pause_campaign
    - condition: days_elapsed >= duration_days
      action: pause_campaign
    - condition: ctr < 0.005 AND impressions > 500
      action: alert_low_ctr
    - condition: cost_per_conversion_cents > 5000 AND conversions >= 3
      action: alert_high_cpa

# --- Thresholds ---
# CRE keywords typically run higher CPC than B2C ($2-4 range). Estimates
# below assume ~$3 average CPC. Adjust after Day 2 if real CPC differs.
thresholds:
  expected_impressions: 2000      # ~400 impressions/day at this spend level
  expected_clicks: 30             # $100 / ~$3.30 avg CPC
  expected_signups: 3             # ~10% landing → signup (cold traffic)
  expected_activations: 1         # ~33% signup → abstract_completed
  go_signal: "1+ activations OR signup_complete rate > 8% by day 5"
  no_go_signal: "0 signups after $50 spend, or CTR < 0.5% after 500 impressions"

# --- Pre-flight checklist (operator confirms before enabling campaign) ---
# 1. [ ] Campaign status is PAUSED in Google Ads UI
# 2. [ ] Landing page PageSpeed score >= 70 (mobile)
# 3. [ ] Offline conversions imported (signup_complete + abstract_completed)
# 4. [ ] Billing address set on the Google Ads subaccount
# 5. [ ] Conversion tracking tag installed (or PostHog connector verified)
# 6. [ ] At least one ad approved (review may take a few hours)
